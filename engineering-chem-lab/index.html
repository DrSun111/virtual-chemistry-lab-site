'cabbage+hcl':{eq:'花青素结构随 pH 改变',type:'酸性显红色',color:'#e34c7b'},'cabbage+naoh':{eq:'花青素结构随 pH 改变',type:'碱性显蓝绿色',color:'#29bd9d'},
'naoh+phenol':{eq:'酚酞酸碱平衡发生移动',type:'碱性显红色',color:'#ed4d91'},
'agno3+ki':{eq:'AgNO₃(aq) + KI(aq) → AgI(s)↓ + KNO₃(aq)',type:'复分解 · 黄色沉淀',color:'#d9d38a',precip:'#f2d84e'},
'cacl2+na2co3':{eq:'CaCl₂(aq) + Na₂CO₃(aq) → CaCO₃(s)↓ + 2NaCl(aq)',type:'复分解 · 白色沉淀',color:'#d8eff1',precip:'#f2f1df'},
'fecl3+naoh':{eq:'FeCl₃(aq) + 3NaOH(aq) → Fe(OH)₃(s)↓ + 3NaCl(aq)',type:'复分解 · 红褐色沉淀',color:'#a96d45',precip:'#9a4d2b'},
'co2+lime':{eq:'CO₂(g) + Ca(OH)₂(aq) → CaCO₃(s)↓ + H₂O(l)',type:'气体检验 · 石灰水变浑浊',color:'#d8eceb',precip:'#eeeeea'},
'cuso4+zn':{eq:'Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)',type:'置换反应 · 铜析出',color:'#b8d6dc',precip:'#c76038'},
'hcl+mg':{eq:'Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)↑',type:'金属与酸 · 快速放出氢气',color:'#a6e4e8',bubble:1,heat:60},
'h2so4+naoh':{eq:'H₂SO₄(aq) + 2NaOH(aq) → Na₂SO₄(aq) + 2H₂O(l)',type:'酸碱中和 · 放热',color:'#82d3df',heat:76},
'hcl+methylorange':{eq:'甲基橙酸碱平衡发生移动',type:'酸性显红色',color:'#e54836'},
'methylorange+naoh':{eq:'甲基橙酸碱平衡发生移动',type:'碱性显黄色',color:'#f2bd32'}};
function svgFor(t){let fn=t.startsWith('gear')||['bevel','chain','belt'].includes(t)?icon.gear:icon[t]||(['servo','hydraulic'].includes(t)?icon.piston:icon.default);return fn(t==='gearLarge'?'#d68945':'#47738e')}
function renderCats(){let data=mode==='eng'?ENG:CHEM;$('#cats').innerHTML=Object.keys(data).map(x=>`<button class="cat ${x===cat?'active':''}">${x}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.textContent;renderCats();renderLibrary()})}
function renderLibrary(){let data=mode==='eng'?ENG:CHEM,q=$('#search').value.trim().toLowerCase(),arr=data[cat].filter(x=>x.join('').toLowerCase().includes(q));$('#library').innerHTML=arr.map(x=>`<div class="item" draggable="true" data-v='${JSON.stringify(x)}'>${mode==='eng'?svgFor(x[0]):reagentSVG(x[0],x[2])}<b>${x[1]}</b><small>${x[2]||'独立机械元件'}</small></div>`).join('');document.querySelectorAll('.item').forEach(el=>{el.onclick=()=>mode==='eng'?addPart(JSON.parse(el.dataset.v)):addReagent(JSON.parse(el.dataset.v));el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.v)})}
function reagentSVG(t,f){let col={hcl:'#a9e6ed',h2so4:'#b5edf2',hno3:'#b8eced',acetic:'#e9d6bb',citric:'#f2e8bd',naoh:'#bde7ee',koh:'#bde7ee',lime:'#d8f0ed',nh3:'#cceef4',cuso4:'#178ed0',feso4:'#73a77d',iodine:'#6e3825',oil:'#e1b33c',cabbage:'#79258d',phenol:'#e5eef2'}[t]||'#badfe7';return `<svg viewBox="0 0 120 90"><path d="M38 10h44v12l-5 7v45c0 8-34 8-34 0V29l-5-7z" fill="#bceaff22" stroke="#9cd8eb" stroke-width="3"/><path d="M45 43h30v29c0 5-30 5-30 0z" fill="${col}" opacity=".85"/><path d="M48 14h24" stroke="#e7faff" stroke-width="4"/><text x="60" y="59" fill="#061523" font-size="11" font-weight="800" text-anchor="middle">${f||t}</text></svg>`}
function addPart(v,x,y){let n=parts.length,p={id:Date.now()+Math.random(),type:v[0],name:v[1],x:x??70+(n%4)*150,y:y??100+Math.floor(n/4)*135};parts.push(p);draw();toast('已加入 '+p.name)}
function draw(){canvas.querySelectorAll('.part,.wire').forEach(x=>x.remove());links.forEach(l=>{let a=parts.find(p=>p.id===l[0]),b=parts.find(p=>p.id===l[1]);if(!a||!b)return;let x1=a.x+126,y1=a.y+55,x2=b.x+6,y2=b.y+55,d=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI,e=document.createElement('i');e.className='wire'+(running?' live':'');e.style.cssText=`left:${x1}px;top:${y1}px;width:${d}px;transform:rotate(${ang}deg)`;canvas.appendChild(e)});parts.forEach(p=>{let e=document.createElement('div');e.className='part'+(pick===p.id?' selected':'')+(running?' running':'');e.style.cssText=`left:${p.x}px;top:${p.y}px`;e.dataset.type=p.type;e.innerHTML=`${svgFor(p.type)}<i class="port left" data-side="l"></i><i class="port right" data-side="r"></i><span class="label">${p.name}</span>`;canvas.appendChild(e);drag(e,p);e.querySelectorAll('.port').forEach(pt=>pt.onclick=q=>{q.stopPropagation();connect(p.id)});e.ondblclick=()=>{parts=parts.filter(x=>x.id!==p.id);links=links.filter(x=>!x.includes(p.id));draw()}});$('#empty').style.display=parts.length?'none':'grid';updatePanel()}
function drag(e,p){let sx,sy,ox,oy;e.onpointerdown=q=>{if(q.target.classList.contains('port'))return;sx=q.clientX;sy=q.clientY;ox=p.x;oy=p.y;e.setPointerCapture(q.pointerId);e.onpointermove=r=>{p.x=Math.max(0,ox+(r.clientX-sx)/scale);p.y=Math.max(55,oy+(r.clientY-sy)/scale);draw()};e.onpointerup=()=>e.onpointermove=null}}
function connect(id){if(pick&&pick!==id){if(!links.some(l=>l.includes(pick)&&l.includes(id)))links.push([pick,id]);pick=null;toast('机械连接已建立')}else pick=pick===id?null:id;draw()}
function updatePanel(){if(mode==='eng'){$('#m1').textContent=parts.length;$('#m2').textContent=links.length;$('#log').innerHTML=links.length?links.map((l,i)=>{let a=parts.find(p=>p.id===l[0]),b=parts.find(p=>p.id===l[1]);return `<div class="connection"><i>0${i+1}</i><span>${a?.name} ↔ ${b?.name}</span></div>`}).join(''):'从元件两侧的发光端口依次点击，即可建立机械连接。'}}
function addReagent(v){if(reagents.length===2)resetReaction();reagents.push(v);$('#eq').textContent=reagents.map(x=>x[2]).join(' + ');$('#eqType').textContent=reagents.length===1?'已加入第一种试剂，选择第二种试剂':'正在注入并计算反应…';animatePour();if(reagents.length===2)setTimeout(react,520)}
function animatePour(){$('#pour').classList.add('on');setTimeout(()=>$('#pour').classList.remove('on'),440)}
function react(){let key=reagents.map(x=>x[0]).sort().join('+'),r=reactions[key];running=true;$('#led').className='led on';$('#state').textContent='反应模拟运行中';$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),600);if(!r){$('#eq').textContent='未检测到明显反应';$('#eqType').textContent='当前条件下无可见反应，或仅发生物理混合';$('#log').innerHTML='<b>判断：</b>没有沉淀、气体、弱电解质生成或显著氧化还原驱动力。';$('#m1').textContent='无明显';$('#m2').textContent='25 ℃';return}$('#eq').textContent=r.eq;$('#eqType').textContent=r.type;$('#liquid').style.setProperty('--liquid',r.color);$('#temp').style.setProperty('--temp',(r.heat||35)+'%');$('#m1').textContent=r.type.split('·').pop().trim();$('#m2').textContent=(r.heat?36:'25')+' ℃';$('#log').innerHTML=`<b>反应判定：</b>${r.type}<br><b>宏观现象：</b>${describe(r)}<br><b>微观解释：</b>${micro(r)}<br><b>科学说明：</b>模拟按定性反应规则展示；真实速率与程度还受浓度、温度、颗粒大小及混合条件影响。`;if(r.bubble)particles('bubble','#fff',14);if(r.precip)particles('precip',r.precip,26);toast('反应已自动发生')}
function particles(cls,col,n){let box=$('#liquid');for(let i=0;i<n;i++){let p=document.createElement('i');p.className='particle '+cls;p.style.cssText=`--x:${5+Math.random()*90}%;--dur:${1+Math.random()*1.5}s;--pc:${col};animation-delay:${Math.random()*.8}s`;box.appendChild(p);setTimeout(()=>p.remove(),3600)}}
function describe(r){if(r.bubble)return'溶液中连续产生气泡并上升逸出。';if(r.precip)return`溶液中生成${r.type.includes('蓝色')?'蓝色':r.type.includes('红色')?'红色':'白色'}固体颗粒并逐渐沉降。`;if(r.layer)return'液体静置后形成清晰的上下两层。';if(r.type.includes('显'))return'溶液发生明显颜色变化。';if(r.heat)return'混合后温度上升，但无明显气体或沉淀。';return'液体颜色或组成发生改变。'}
function micro(r){if(r.bubble)return'反应生成气体分子，超过溶液溶解能力后成核并形成气泡。';if(r.precip)return'溶液中的离子结合成难溶物，形成固体晶核并聚集。';if(r.layer)return'两种液体极性和密度不同，不能形成均一相。';if(r.type.includes('酸碱'))return'H⁺ 与 OH⁻ 结合形成水分子，同时释放热量。';return'粒子结构或平衡状态改变，导致吸收光谱发生变化。'}
function resetReaction(){reagents=[];running=false;$('#liquid').style.setProperty('--liquid','#55cce0aa');$('#liquid').querySelectorAll('.particle').forEach(x=>x.remove());$('#temp').style.setProperty('--temp','30%');$('#led').className='led';$('#state').textContent='等待试剂';$('#eq').textContent='请选择两种试剂';$('#eqType').textContent='系统会自动判断可见现象与反应类型'}
function setMode(m){mode=m;cat=Object.keys(m==='eng'?ENG:CHEM)[0];parts=[];links=[];pick=null;running=false;reagents=[];document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('#canvas').style.display=m==='eng'?'block':'none';$('#chemStage').classList.toggle('show',m==='chem');$('#run').style.display=m==='eng'?'block':'none';$('#libTitle').textContent=m==='eng'?'工程元件库':'材料与试剂库';$('#libSub').textContent=m==='eng'?'单击加入，或拖拽到精确位置':'选择两种试剂后立即进行仿真';$('#stageTag').textContent=m==='eng'?'自由设计 · 点击端口建立连接':'器皿级反应仿真 · 自动判定现象';$('#detailTitle').textContent=m==='eng'?'连接记录':'反应分析';$('#m1l').textContent=m==='eng'?'元件':'现象';$('#m2l').textContent=m==='eng'?'连接':'温度';$('#m1').textContent='0';$('#m2').textContent='0';$('#log').textContent=m==='eng'?'从元件两侧的发光端口依次点击，即可建立机械连接。':'选择两种试剂，系统将展示反应式、宏观现象和微观解释。';$('#demos').innerHTML=m==='eng'?`<div class="reaction-card" onclick="demoEng()"><b>齿轮传动机构</b><small>三齿轮联动与动态演示</small></div>`:`<div class="reaction-card" onclick="demoChem('hcl','na2co3')"><b>气体生成</b><small>酸与碳酸盐</small></div><div class="reaction-card" onclick="demoChem('cuso4','naoh')"><b>沉淀生成</b><small>蓝色氢氧化铜</small></div><div class="reaction-card" onclick="demoChem('iodine','starch')"><b>络合显色</b><small>淀粉与碘</small></div>`;resetReaction();renderCats();renderLibrary();draw()}
function demoEng(){parts=[];links=[];[['gearLarge','大齿轮'],['gear','直齿轮'],['gear','直齿轮']].forEach((x,i)=>parts.push({id:Date.now()+i,type:x[0],name:x[1],x:85+i*145,y:220+(i%2)*20}));links=[[parts[0].id,parts[1].id],[parts[1].id,parts[2].id]];draw()}
function demoChem(a,b){resetReaction();let all=Object.values(CHEM).flat();addReagent(all.find(x=>x[0]===a));setTimeout(()=>addReagent(all.find(x=>x[0]===b)),280)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}
stage.ondragover=e=>e.preventDefault();stage.ondrop=e=>{e.preventDefault();let v;try{v=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}mode==='eng'?addPart(v,e.offsetX-66,e.offsetY-55):addReagent(v)};$('#search').oninput=renderLibrary;$('#run').onclick=()=>{if(!parts.length)return toast('请先加入工程元件');running=!running;$('#run').textContent=running?'暂停系统':'启动系统';$('#led').className=running?'led on':'led';$('#state').textContent=running?'机械系统运行中':'机械系统已暂停';draw()};$('#clear').onclick=()=>mode==='eng'?(parts=[],links=[],running=false,draw()):resetReaction();$('#plus').onclick=()=>{scale=Math.min(1.25,scale+.1);canvas.style.transform=`scale(${scale})`};$('#minus').onclick=()=>{scale=Math.max(.7,scale-.1);canvas.style.transform=`scale(${scale})`};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode('eng');
</script>
<style>
.stage{background:#0a1724;background-image:linear-gradient(145deg,#0d2133 0%,#07111c 62%,#0c1b29 100%)}.stage:before{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#173047,#0c1823);border-top:1px solid #31526a;transform:perspective(500px) rotateX(10deg);transform-origin:bottom}.part{transition:filter .2s;transform-style:preserve-3d}.part svg{transform:perspective(500px) rotateX(8deg) rotateY(-7deg);filter:drop-shadow(8px 10px 7px #0009)}.part:hover svg{filter:drop-shadow(0 0 12px #4adfff77) drop-shadow(8px 10px 7px #0009)}.port{display:none!important}.wire{height:9px;background:linear-gradient(#9eb6c7,#2a536b 45%,#122a3d 55%,#71b7cf);box-shadow:0 5px 9px #0008;z-index:2}.wire.electric{height:4px;background:#31d8ff;box-shadow:0 0 9px #31d8ff}.wire.mech{height:11px;background:linear-gradient(#dce7ed,#71899a 42%,#314b5d 60%,#91aab8)}.sun-orb{position:absolute;right:8%;top:10%;width:94px;height:94px;border-radius:50%;background:radial-gradient(circle,#fff9a8 0 12%,#ffd145 32%,#ff8a24 68%,#ff7b1800 72%);box-shadow:0 0 25px #ffd84b,0 0 70px #ffad2f99;z-index:1;animation:sunPulse 2.2s ease-in-out infinite alternate}.sun-ray{position:absolute;right:14%;top:20%;width:42%;height:3px;background:linear-gradient(90deg,#ffe680bb,#ffe68000);transform:rotate(151deg);transform-origin:right;filter:drop-shadow(0 0 6px #ffe66d);z-index:1}.snap-hint{position:absolute;width:148px;height:138px;border:2px dashed #35dfff;border-radius:22px;pointer-events:none;z-index:8;animation:hintPulse .7s infinite alternate}.logic-badge{position:absolute;top:3px;right:3px;background:#07131fee;border:1px solid #2c526c;border-radius:6px;padding:3px 5px;font-size:8px;color:#86a9be}.part.invalid{filter:drop-shadow(0 0 13px #ff5269)}.part.valid{filter:drop-shadow(0 0 13px #3ce4a5)}@keyframes sunPulse{to{transform:scale(1.08);filter:brightness(1.15)}}@keyframes hintPulse{to{border-color:#9cf4ff;box-shadow:0 0 18px #34dbff66}}
</style>
<script>
/* Engineering simulation v3: smooth drag, invisible interfaces, proximity snap and graph validation. */
const roleMap={battery:'source',solar:'source',turbine:'source',switch:'control',relay:'control',chip:'control',pid:'control',motor:'actuator',servo:'actuator',stepper:'actuator',pump:'actuator',compressor:'actuator',gear:'drive',gearLarge:'drive',bevel:'drive',worm:'drive',shaft:'drive',bearing:'drive',chain:'drive',belt:'drive',coupling:'drive',cam:'drive',flywheel:'drive',differential:'drive',rack:'drive',wheel:'load',track:'load',arm:'load',platform:'load',fan:'load',piston:'load',hydraulic:'load',valve:'load',valve2:'load'};
function roleOf(t){return roleMap[t]||'structure'}function edgeKind(a,b){let x=roleOf(a.type),y=roleOf(b.type),pair=[x,y].sort().join('-');if(['control-source','actuator-control','actuator-source'].includes(pair))return'electric';if(['actuator-drive','drive-drive','drive-load','actuator-load'].includes(pair))return'mech';return null}
function sunSync(){document.querySelectorAll('.sun-orb,.sun-ray').forEach(e=>e.remove());if(mode==='eng'&&parts.some(p=>p.type==='solar')){let s=document.createElement('i'),r=document.createElement('i');s.className='sun-orb';r.className='sun-ray';stage.append(s,r)}}
function modelBadge(p){return `<span class="logic-badge">${({source:'能源',control:'控制',actuator:'执行',drive:'传动',load:'负载',structure:'结构'})[roleOf(p.type)]}</span>`}
draw=function(){canvas.querySelectorAll('.part,.wire').forEach(x=>x.remove());links.forEach(l=>{let a=parts.find(p=>p.id===l[0]),b=parts.find(p=>p.id===l[1]);if(!a||!b)return;let x1=a.x+66,y1=a.y+55,x2=b.x+66,y2=b.y+55,d=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI,e=document.createElement('i'),kind=edgeKind(a,b)||'mech';e.className='wire '+kind+(running?' live':'');e.style.cssText=`left:${x1}px;top:${y1}px;width:${d}px;transform:rotate(${ang}deg)`;canvas.appendChild(e)});parts.forEach(p=>{let e=document.createElement('div');e.className='part'+(running?' running':'');e.style.cssText=`left:${p.x}px;top:${p.y}px`;e.dataset.type=p.type;e.dataset.id=p.id;e.innerHTML=`${svgFor(p.type)}${modelBadge(p)}<span class="label">${p.name}</span>`;canvas.appendChild(e);smoothDrag(e,p);e.ondblclick=()=>{parts=parts.filter(x=>x.id!==p.id);links=links.filter(x=>!x.includes(p.id));draw();sunSync()}});$('#empty').style.display=parts.length?'none':'grid';sunSync();updatePanel()};
function smoothDrag(el,p){let sx,sy,ox,oy,raf;el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=p.x;oy=p.y;el.setPointerCapture(e.pointerId);el.style.zIndex=20;el.onpointermove=q=>{let nx=Math.max(0,ox+(q.clientX-sx)/scale),ny=Math.max(55,oy+(q.clientY-sy)/scale);p.x=nx;p.y=ny;if(!raf)raf=requestAnimationFrame(()=>{el.style.left=p.x+'px';el.style.top=p.y+'px';showSnapHint(p);raf=null})};el.onpointerup=()=>{el.onpointermove=null;el.style.zIndex='';document.querySelectorAll('.snap-hint').forEach(x=>x.remove());autoSnap(p);draw()}}}
function nearestCompatible(p){let best=null,dist=Infinity;parts.forEach(q=>{if(q.id===p.id||links.some(l=>l.includes(p.id)&&l.includes(q.id))||!edgeKind(p,q))return;let d=Math.hypot(q.x-p.x,q.y-p.y);if(d<dist){dist=d;best=q}});return dist<185?best:null}
function showSnapHint(p){document.querySelectorAll('.snap-hint').forEach(x=>x.remove());let q=nearestCompatible(p);if(!q)return;let h=document.createElement('i');h.className='snap-hint';h.style.cssText=`left:${q.x-8}px;top:${q.y-8}px`;canvas.appendChild(h)}
function autoSnap(p){let q=nearestCompatible(p);if(!q)return;let dx=p.x-q.x,dy=p.y-q.y;if(Math.abs(dx)>Math.abs(dy)){p.x=q.x+(dx>0?145:-145);p.y=q.y}else{p.y=q.y+(dy>0?130:-130);p.x=q.x}links.push([q.id,p.id]);toast(`${q.name} 与 ${p.name} 已自动吸附`)}
function graphPath(source,target){let seen=new Set([source]),queue=[source];while(queue.length){let n=queue.shift();if(n===target)return true;links.forEach(l=>{let k=l[0]===n?l[1]:l[1]===n?l[0]:null;if(k&&!seen.has(k)){seen.add(k);queue.push(k)}})}return false}
function validateMachine(){let sources=parts.filter(p=>roleOf(p.type)==='source'),acts=parts.filter(p=>roleOf(p.type)==='actuator'),loads=parts.filter(p=>roleOf(p.type)==='load'),bad=links.filter(l=>{let a=parts.find(p=>p.id===l[0]),b=parts.find(p=>p.id===l[1]);return!a||!b||!edgeKind(a,b)});let errors=[];if(!sources.length)errors.push('缺少能源：加入电池、太阳能板或风力涡轮');if(!acts.length)errors.push('缺少执行器：加入电机、伺服机构或泵');if(!loads.length)errors.push('缺少机械负载：加入车轮、机械臂、风机或活塞');if(bad.length)errors.push('存在不兼容接口');let chain=sources.some(s=>acts.some(a=>graphPath(s.id,a.id)&&loads.some(l=>graphPath(a.id,l.id))));if(sources.length&&acts.length&&loads.length&&!chain)errors.push('能源—执行器—负载尚未形成连续传动路径');return{ok:!errors.length,errors}}
function runEngineering(){if(mode!=='eng')return;let v=validateMachine();canvas.querySelectorAll('.part').forEach(e=>e.classList.remove('invalid','valid'));if(!v.ok){running=false;$('#led').className='led';$('#state').textContent='装配校验失败';$('#log').innerHTML='<b style="color:#ff7185">无法启动</b><br>'+v.errors.map((x,i)=>`${i+1}. ${x}`).join('<br>');parts.forEach(p=>{let e=canvas.querySelector(`[data-id="${p.id}"]`);if(e)e.classList.add('invalid')});toast('结构不符合运行逻辑');return}running=!running;$('#run').textContent=running?'停止系统':'启动系统';$('#led').className=running?'led on':'led';$('#state').textContent=running?'能量与传动链运行中':'系统已停止';draw();if(running){canvas.querySelectorAll('.part').forEach(e=>e.classList.add('valid'));$('#log').innerHTML='<b style="color:#48e6aa">装配验证通过</b><br>能源输出正常；执行器获得动力；机械负载通过兼容接口形成连续传动链。'}}
const oldAddPart=addPart;addPart=function(v,x,y){oldAddPart(v,x,y);sunSync()};$('#run').onclick=runEngineering;setMode('eng');$('#run').onclick=runEngineering;
</script></body></html>
